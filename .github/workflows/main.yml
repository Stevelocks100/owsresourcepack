name: Build Resource Pack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build resource pack
        shell: bash
        run: |
          set -e
      
          MAIN="./resourcepacks/main"
          BUILD="./build/main"
          OUTPUT="./main.zip"

          rm -rf ./build "$OUTPUT"
          mkdir -p "$BUILD"
      
          echo "Copying main resource pack..."
          cp -a "$MAIN/." "$BUILD/"
      
          shopt -s nullglob
      
          # Copy every surface-level resourcepack except main
          for dir in ./resourcepacks/*/; do
            [ -d "$dir" ] || continue
      
            name="$(basename "$dir")"
      
            if [ "$name" = "main" ]; then
              continue
            fi
      
            echo "Adding overlay: $name"
      
            cp -a "$dir" "$BUILD/$name"
          done
      
          # Generate overlays in pack.mcmeta
          python3 - <<'PY'
          import json
          from pathlib import Path
      
          mcmeta_path = Path("./build/main/pack.mcmeta")
      
          with mcmeta_path.open("r", encoding="utf-8") as f:
              data = json.load(f)
      
          entries = []
      
          for path in sorted(Path("./resourcepacks").iterdir()):
              if not path.is_dir():
                  continue
      
              if path.name == "main":
                  continue
              if path.name.startswith("."):
                  continue
      
              entries.append({
                  "directory": path.name,
                  "formats": [63, 999],
                  "min_format": 63,
                  "max_format": 999
              })
      
          data["overlays"] = {
              "entries": entries
          }
      
          with mcmeta_path.open("w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
      
          echo "Generated pack.mcmeta:"
          cat "$BUILD/pack.mcmeta"
      
          echo "Zipping final resource pack..."
      
          (
            cd "$BUILD"
            zip -r -9 -q "../../main.zip" .
          )
      
          echo "Created:"
          ls -lh ./main.zip
      - name: Get latest release info
        id: get_release
        shell: bash
        run: |
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" > release.json

          RELEASE_ID=$(jq -r '.id // empty' release.json)

          if [ -z "$RELEASE_ID" ]; then
            echo "No latest release found or release ID is null"
            exit 1
          fi

          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

      - name: Delete old resource pack
        shell: bash
        run: |
          ASSET_ID=$(jq -r '.assets[] | select(.name == "main.zip") | .id // empty' release.json)

          if [ -n "$ASSET_ID" ]; then
            echo "Deleting old asset with ID $ASSET_ID"

            curl -sSL -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
          else
            echo "No existing main.zip asset found to delete"
          fi

      - name: Upload resource pack to latest release
        shell: bash
        run: |
          curl -sSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @main.zip \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ env.RELEASE_ID }}/assets?name=main.zip&label=main.zip"
